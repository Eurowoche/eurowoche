{{ define "main" }}
<article class="page-content veranstaltungen-page">
    <div class="page-body">
        <h1 class="veranstaltungen-heading">{{ .Title }}</h1>
        <div class="events-grid">
            {{ range sort .Pages "Params.date_start" "asc" }}
            {{ $page := . }}
            <div class="event-card">
                {{ with .Params.image }}
                <div class="event-card-image">
                    <img src="{{ . }}" alt="{{ $page.Title }}" loading="lazy">
                    {{ with $page.Params.ribbon }}<span class="event-card-ribbon"
                        data-soon="{{ . }}"
                        data-live="{{ $page.Params.ribbon_live }}"
                        data-start="{{ $page.Params.date_start }}"
                        data-end="{{ $page.Params.date_end }}">{{ . }}</span>{{ end }}
                </div>
                {{ end }}
                <div class="event-card-body">
                    <h2>{{ .Title }}</h2>
                    <p class="event-meta">
                        <span class="event-date">{{ .Params.date_display }}</span>
                        <a class="event-location" href="https://maps.google.com/maps?q={{ .Params.location | urlquery }}" target="_blank" rel="noopener">{{ .Params.location }}</a>
                    </p>
                    <a href="{{ .RelPermalink }}" class="event-mehr-link">{{ i18n "learn_more" }}</a>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</article>
<script>
document.querySelectorAll('.event-card-ribbon').forEach(function(el) {
    var start = el.dataset.start;
    var end = el.dataset.end;
    var live = el.dataset.live;
    if (!start) return;
    var now = new Date();
    var startDate = new Date(start);
    var endDate = end ? new Date(new Date(end).getTime() + 86400000) : null;
    if (endDate && now >= endDate) {
        el.parentElement.removeChild(el);
    } else if (now >= startDate && live) {
        el.textContent = live;
    }
});
</script>
{{ end }}
